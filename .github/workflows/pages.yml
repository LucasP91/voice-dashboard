name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deployments instead of cancelling in-flight ones (same as the portfolio).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # Publish only the site files, not tests or tooling.
      - run: mkdir _site && cp index.html app.js logic.js style.css _site/
      # Stamp file links with the commit, so a fresh page never pairs with an old cached script.
      - run: sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" _site/index.html _site/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
